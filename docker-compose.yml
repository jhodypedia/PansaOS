services:
  core:
    build: {context: ., dockerfile: docker/Dockerfile.core}
    env_file: [.env]
    environment: {PORT: '3001', SANDBOX_NETWORK: 'true'}
    volumes: [./data:/app/data, ./workspace:/app/workspace, ./skills:/app/skills, ./plugins:/app/plugins, /var/run/docker.sock:/var/run/docker.sock]
    depends_on: {sandbox: {condition: service_completed_successfully}}
    restart: unless-stopped
    healthcheck: {test: [CMD, curl, -fsS, http://localhost:3001/health], interval: 30s, timeout: 5s, retries: 5}
  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile.dashboard}
    environment: {CORE_URL: http://core:3001}
    depends_on: {core: {condition: service_healthy}}
    restart: unless-stopped
  sandbox:
    image: pansaos-sandbox:local
    build: {context: ., dockerfile: docker/Dockerfile.sandbox}
    command: ["true"]
    restart: "no"
  caddy:
    image: caddy:2.9-alpine
    environment: {PANSA_DOMAIN: '${PANSA_DOMAIN:-localhost}'}
    ports: ['80:80','443:443']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [core, dashboard]
    restart: unless-stopped
volumes: {pansa_data: {}, pansa_workspace: {}, pansa_skills: {}, caddy_data: {}, caddy_config: {}}
